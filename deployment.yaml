apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-web
  template:
    metadata:
      labels:
        app: devops-web
    spec:
      containers:
        - name: web
          image: praneeth333lucky/devops-web:1.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: devops-web-service
spec:
  type: NodePort
  selector:
    app: devops-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080